version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Apache Kafka (KRaft mode - no Zookeeper required)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fingraph-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ----------------------------------------------------------------------------
  # Neo4j Graph Database (v5.x with GDS & APOC plugins)
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.18.0
    container_name: fingraph-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/fingraph_secret_pass
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "fingraph_secret_pass", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/seed:/seed

  # ----------------------------------------------------------------------------
  # Apache Flink JobManager
  # ----------------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: fingraph-flink-jobmanager
    ports:
      - "8081:8081" # Flink Web UI
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    depends_on:
      kafka:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Apache Flink TaskManager
  # ----------------------------------------------------------------------------
  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: fingraph-flink-taskmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    depends_on:
      - flink-jobmanager

  # ----------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fingraph-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fingraph_secret_pass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ALERT_MODE=mock
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # React Dashboard
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fingraph-dashboard
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  kafka_data:
  neo4j_data:
  neo4j_logs:

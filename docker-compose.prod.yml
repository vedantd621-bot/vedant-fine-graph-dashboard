version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fingraph-prod-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT:[/kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERs: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVNNTwwNTZkNDM2Qk'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    networks:
      - fingraph-internal

  neo4j:
    image: neo4j:5.18.0
    container_name: fingraph-prod-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/fingraph_secret_pass
      - NEO5J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO5J_dbms_memory_heap_initial__size=1G
      - NEO5J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=1G:    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6144M
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "fingraph_secret_pass", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - neo4j_prod_data:/data
      - neo4j_prod_logs:/logs
    networks:
      - fingraph-internal

  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: fingraph-prod-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 4
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fingraph-internal

